<!DOCTYPE html>
<html lang="{{ site.lang | default: 'el' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.url != '/' and page.title %}{{ page.title | strip_html }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;1,400&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <p class="organiser">{{ site.organiser }}</p>
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <p class="subtitle">{{ site.subtitle }}</p>
      <p class="place-date">{{ site.place_date }}</p>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">{{ site.organiser }} · {{ site.place_date }}</div>
  </footer>
</body>
</html>
